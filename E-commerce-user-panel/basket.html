<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basket Screen</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.protocol === "file:") {
        window.location.href = "./login.html";
      }
    </script>
  </head>
    <div class="w-full h-[100vh]">
      <nav class="w-full">
        <div
          class="w-full pl-[20px] h-[80px] flex items-center pr-[50px] justify-between gap-4"
        >
          <div class="flex items-center ">
            <img src="./image/logo.png" class="w-22" alt="" />
            <a
              href="index.html"
              class="text-[32px] font-bold text-[#053D2E]"
              id="trendBy"
            >
              TrendBy
            </a>
          </div>

          <div class="flex items-center gap-10">
            <div class="relative group">
              <div class="flex items-center gap-2 cursor-pointer">
                <p class="font-[500]">Categories</p>
                <i class="fa-solid fa-angle-down text-sm pt-[2px]"></i>
              </div>

              <div
                id="categoryDropdown"
                class="absolute top-full left-0 w-56 bg-white rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 mt-4"
              ></div>
            </div>

            <p class="cursor-pointer font-[500]">Deals</p>
            <p class="cursor-pointer font-[500]">What's New</p>
            <p class="cursor-pointer font-[500]">Delivery</p>
          </div>

          <div class="flex items-center w-[400px] justify-end">
            <div class="relative flex-end flex">
              <div
                id="searchBox"
                class="w-[300px] h-[46px] px-4 rounded-full flex items-center gap-3 bg-gray-50"
              >
                <input
                  id="searchInput"
                  type="text"
                  placeholder="Search Product"
                  class="w-full outline-none bg-transparent"
                />

                <i
                  id="searchIcon"
                  class="fa-solid fa-magnifying-glass text-gray-500 cursor-pointer flex-end"
                ></i>
              </div>

              <div
                id="searchResults"
                class="absolute top-14 right-0 w-[750px] bg-white shadow-lg hidden z-50"
              ></div>
            </div>
          </div>

          <div class="flex items-center gap-6">
            <div class="relative group">
              <div class="flex items-center gap-2 cursor-pointer">
                <i class="fa-regular fa-user text-xl"></i>
                <p class="font-[500]">Account</p>
              </div>

              <div
                class="absolute right-0 pt-6 w-55 bg-white rounded-xl shadow-lg hidden group-hover:block z-50"
              >
                <a href="orders.html" class="block px-4 py-3 hover:bg-gray-100">
                  My orders
                </a>

                <a
                  href="profile.html"
                  class="block px-4 py-3 hover:bg-gray-100"
                >
                  User İnformation
                </a>

                <button
                  id="logoutBtn"
                  class="w-full text-left px-4 py-3 hover:bg-red-100 text-red-600 cursor-pointer"
                >
                  Log Out
                </button>
              </div>
            </div>

            <div class="relative cursor-pointer basket-card">
              <div class="flex items-center gap-2" id="basket-icon">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <p class="font-[500]">Cart</p>
              </div>

              <span
                id="basketCount"
                class="absolute -top-3 left-4 w-5 h-5 rounded-full bg-red-500 text-white text-xs flex items-center justify-center hidden"
              >
                0
              </span>
            </div>
          </div>
        </div>
      </nav>

      <main class="w-full flex gap-6 justify-center items-start px-9 mt-6">
            <div
    id="toast"
    class="fixed top-5 right-5 bg-red-500 text-white px-5 py-3 rounded-lg shadow-lg hidden z-50">
    </div>
    <div
    id="toast"
    class="fixed top-5 right-5 bg-green-500 text-white px-5 py-3 rounded-lg shadow-lg hidden z-50">
    </div>
       <div class=" w-[70%]">
          <div class="w-full  items-center flex gap-2"><h2 class="text-[24px] font-bold text-[#F27A1A]">My Cart</h2>
        <span class="text-[20px] font-medium text-[#F27A1A]" id="productCount"></span>
        </div>

      <div class="w-full flex flex-col mt-7 overflow-y-auto h-[calc(100vh-180px)]"> 
    <div id="basketProducts" ></div>

    
        </div>
        </div>
        <div class=" w-[26%] flex flex-col px-6 mt-16 max-h-[300px] py-6 border border-gray-200">
            <div class="w-full flex justify-start items-center">
                <h4 class="font-bold text-[19px] text-[orange]">Cart Summary</h4>
            </div>
            <div class="w-full flex justify-start items-center flex-col ">
                <div class="w-full flex justify-between mt-7">
                    <p class="font-medium text-[#484848]">Subtotal</p>
                    <p id="summaryPrice">₺0</p>
                </div>
                <div class="w-full flex justify-between mt-4">
                    <p class="font-medium text-[#484848]">Shipping Cost</p>
                     <p id="shippingPrice">₺0</p>
                </div>
                <hr class="w-full text-gray-300 mt-4">
                 <div class="w-full flex justify-between mt-2">
                    <p class="font-medium text-[#484848]">Total</p>
                    <p class="text-[#F27A1A] font-bold" id="totalPrice"></p>
                </div>
            </div>
            <button class="mt-10 bg-[#F27A1A] px-7 py-3 text-[#fff] font-medium text-[16px]" id="confirmCart">Confirm Cart</button>
        </div>
      </main>

     <div id="deleteModal"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50"
>
    <div class="bg-white w-[400px] rounded-xl p-6 shadow-xl">

        <div class="flex justify-between items-center mb-5">
            <h2 class="text-xl font-bold">Delete Product</h2>

            <button id="closeModal">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <p>Are you sure you want to delete this product?</p>

        <div class="flex justify-end gap-3 mt-6">
            <button
                id="cancelBtn"
                class="px-4 py-2 border rounded-lg"
            >
                Cancel
            </button>

            <button id="confirmDelete"
                class="px-4 py-2 bg-red-500 text-white rounded-lg"
            >
                Delete
            </button>
        </div>

    </div>
    </div>
        
      </div>
    </div>
    <script src="./js/basket.js" type="module"></script>
  </body>
</html>
