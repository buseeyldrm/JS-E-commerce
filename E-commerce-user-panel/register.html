<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-[Poppins] bg-white">
    <div class="w-full h-screen flex items-center justify-center">
      <div class="w-full h-screen flex items-center justify-center">
        <div
          class="w-[90%] min-h-[800px] flex rounded-[30px] overflow-hidden bg-white shadow-[0_20px_60px_rgba(0,0,0,0.12)]"
        >
          <div
            id="toast"
            class="fixed top-5 right-5 translate-x-[500px] transition-all duration-500 z-50"
          ></div>
          <div class="w-1/2 flex items-center">
            <div class="w-[75%] mx-auto flex flex-col gap-8">
              <h2 class="text-[32px] font-semibold">Create your account</h2>

              <form class="flex flex-col gap-5" id="registerForm">
                <div class="grid grid-cols-2 gap-4">
                  <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-[#484848]"
                      >First Name</label
                    >
                    <input
                      type="text"
                      placeholder="Enter first name"
                      class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                      id="firstName"
                    />
                  </div>

                  <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-[#484848]"
                      >Last Name</label
                    >
                    <input
                      type="text"
                      placeholder="Enter last name"
                      class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                      id="lastName"
                    />
                  </div>
                </div>

                <div class="flex flex-col gap-2">
                  <label class="text-sm font-bold text-[#484848]">Email</label>

                  <input
                    type="email"
                    placeholder="Enter your email"
                    class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                    id="email"
                  />
                </div>

                <div class="flex flex-col gap-2">
                  <label class="text-sm font-bold text-[#484848]"
                    >Phone Number</label
                  >

                  <input
                    type="tel"
                    placeholder="05xxxxxxxxx"
                    class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                    id="phone"
                  />
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-[#484848]">
                      Birth Date
                    </label>

                    <input
                      type="date"
                      id="birthDate"
                      class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                    />
                  </div>

                  <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-[#484848]">
                      Gender
                    </label>

                    <select
                      id="gender"
                      class="h-14 rounded-[5px] border border-gray-300 px-5 bg-[#f5f5f5] outline-none"
                    >
                      <option value="">Select Gender</option>
                      <option value="female">Female</option>
                      <option value="male">Male</option>
                    </select>
                  </div>
                </div>

                <div class="flex flex-col gap-2">
                  <label class="text-sm font-bold text-[#484848]"
                    >Password</label
                  >

                  <div class="relative">
                    <div class="relative">
                      <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        class="w-full h-14 rounded-[5px] border border-gray-300 px-5 pr-14 bg-[#f5f5f5] outline-none"
                      />

                      <button
                        id="togglePassword"
                        type="button"
                        class="absolute inset-y-0 right-4 flex items-center"
                      >
                        <i
                          id="passwordIcon"
                          class="fa-regular fa-eye text-gray-500"
                        ></i>
                      </button>
                    </div>
                  </div>
                </div>

                <button
                  id="registerBtn"
                  type="submit"
                  class="h-14 rounded-xl bg-black text-white font-semibold hover:opacity-90 transition cursor-pointer"
                >
                  Create Account
                </button>
              </form>

              <p class="text-center text-gray-500">
                Already have an account?

                <a href="login.html" class="font-semibold text-black ml-1">
                  Sign In
                </a>
              </p>
            </div>
          </div>

          <div class="w-1/2">
            <img
              src="./image/foto.png"
              class="w-full h-full object-cover"
              alt=""
            />
          </div>
        </div>
      </div>
    </div>
    <script src="./js/register.js" type="module"></script>
  </body>
</html>
