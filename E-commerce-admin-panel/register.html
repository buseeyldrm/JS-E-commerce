<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Screen</title>
    <link rel="stylesheet" href="./css/register.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="login-page">
        <div class="login-page-image">
          <img src="./image/login-img.jpg" alt="" />
        </div>
        <div class="forms">
          <div class="signUp-page form">
            <div class="sign-up-container">
              <div class="sign-logo">
                <i class="fa-brands fa-opencart"></i>
                <span class="create-span">Create Account</span>
              </div>
              <div class="sign-up">
                <div class="sign-up-name">
                  <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Name" />
                    <span id="nameError" class="error-text"></span>
                  </div>

                  <div class="input-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Surname" />
                    <span id="surnameError" class="error-text"></span>
                  </div>
                </div>

                <div class="sign-up-phone">
                  <div class="input-group-phone">
                    <label for="tel">Phone Number</label>
                    <div class="phone-input">
                      <select name="" id="countryCode">
                        <option value="+90" selected>🇹🇷 TR +90</option>
                        <option value="+1">🇺🇸 US +1</option>
                      </select>
                      <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                      />
                    </div>

                    <span id="phoneError" class="error-text"></span>
                  </div>
                </div>
                <div class="sign-up-country">
                  <div class="input-group-country">
                    <label for="country">Your country</label>
                    <div class="country-input">
                      <select id="country">
                        <option value="">Select country</option>
                        <option value="TR">🇹🇷 (TR) Türkiye</option>
                        <option value="US">🇺🇸 (US) United States</option>
                      </select>
                    </div>
                    <span id="countryError" class="error-text"></span>
                  </div>
                </div>
                <div class="sign-up-email">
                  <div class="input-group-email">
                    <label for="email">E-mail</label>
                    <input
                      type="email"
                      id="createEmail"
                      placeholder="E-mail@example.com"
                    />
                    <span id="createEmailError" class="error-text"></span>
                  </div>
                </div>
                <div class="sign-up-password">
                  <div class="input-group-password">
                    <label for="password">Password</label>
                    <div class="password-div">
                      <input
                        type="password"
                        id="password"
                        placeholder="Password"
                      />
                      <i class="fa-regular fa-eye"></i>
                      <i
                        class="fa-regular fa-eye-slash"
                        style="display: none"
                      ></i>
                    </div>
                    <p class="password-info">
                      Your password must be at least 8 characters long and must
                      contain at least one uppercase letter, one lowercase
                      letter, and one number.
                    </p>
                  </div>
                  <span id="passwordError" class="error-text"></span>

                  <div class="sign-up-password-confirm">
                    <div class="input-group-password">
                      <label for="password">Confirm Password</label>
                      <div class="password-div">
                        <input
                          type="password"
                          id="passwordConfirm"
                          placeholder="Confirm Password"
                        />
                        <i class="fa-regular fa-eye"></i>
                        <i
                          class="fa-regular fa-eye-slash"
                          style="display: none"
                        ></i>
                      </div>
                      <span id="passwordConfirmError" class="error-text"></span>
                    </div>
                  </div>
                </div>
                <button class="sign-up-button">Sign Up</button>
                <div class="sign-up-confirm">
                  <a href="" id="showLogin"
                    >Do you have an account?
                    <span class="login-span">Log in</span></a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/register.js" type="module"></script>
  </body>
</html>
