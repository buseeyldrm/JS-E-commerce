<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="./css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.protocol === "file:") {
        window.location.href = "./login.html";
      }
    </script>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-brands fa-opencart"></i>
        </div>

        <nav class="menu">
          <a id="ordersMenu" href="order.html">Orders</a>
          <a id="productsMenu" href="dashboard.html">Products</a>
          <a id="categoriesMenu" href="categories.html">Categories</a>
          <a id="campaignsMenu" href="campaigns.html">Campaigns</a>
          <a id="settingsMenu" href="general-settings.html">Settings</a>
        </nav>

        <div class="profile">
          <div class="user">
            <div class="userFirst">
              <p class="userNameFirst" id="userNameFirst"></p>
            </div>
            <div class="userName"><p id="userName">Users</p></div>
          </div>

          <button id="logoutBtn">Logout</button>
        </div>
      </aside>

      <div class="content">
        <header>
          <h2 id="pageTitle">Products</h2>
        </header>

        <main>
          <div class="products-card">
            <div class="card-header">
              <button class="add-btn">
                <span class="loader"></span>Add Product
              </button>
              <div class="multi-select-menu">
                <div class="multi-select" id="categoryFilter">
                  <div class="select-btn">
                    <p>Category</p>
                    <i class="fa-solid fa-angle-down"></i>
                  </div>

                  <div class="dropdown">
                    <label><input type="checkbox" value="shoes" />Shoes</label>
                    <label
                      ><input type="checkbox" value="clothes" />Clothes</label
                    >
                    <label><input type="checkbox" value="books" />Book</label>
                    <label
                      ><input
                        type="checkbox"
                        value="electronic"
                      />Electronic</label
                    >
                    <label
                      ><input type="checkbox" value="makeup" />Makeup</label
                    >
                  </div>
                </div>
                <div class="multi-select vat" id="vatFilter">
                  <div class="select-btn">
                    <p>VAT Rate</p>
                    <i class="fa-solid fa-angle-down"></i>
                  </div>

                  <div class="dropdown">
                    <label><input type="checkbox" value="%3" /> %3</label>
                    <label><input type="checkbox" value="%5" /> %5</label>
                    <label><input type="checkbox" value="%12" /> %12</label>
                  </div>
                </div>
                <div class="select" id="statusFilter">
                  <div class="status-btn">
                    <p>Status</p>
                    <i class="fa-solid fa-angle-down"></i>
                  </div>

                  <div class="status-dropdown">
                    <label
                      ><input type="checkbox" value="active" />Active</label
                    >
                    <label
                      ><input type="checkbox" value="passive" /> Passive</label
                    >
                  </div>
                </div>
              </div>
            </div>
            <table class="products-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Product Image</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th class="price">Price</th>
                  <th>VAT Rate</th>
                  <th>Stock Status</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="productsBody"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <div class="modal" id="deleteModal">
      <div class="modal-content">
        <h3>Delete Product</h3>
        <p>Are you sure you want to delete this product?</p>

        <div class="modal-buttons">
          <button id="cancelBtn">Cancel</button>
          <button id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
    <div class="modal" id="detailModal">
      <div class="modal-content-info">
        <h2>Product Details</h2>

        <div id="detailBody"></div>

        <button id="closeDetailModal">Close</button>
      </div>
    </div>

    <script src="./js/dashboard.js" type="module"></script>
  </body>
</html>
