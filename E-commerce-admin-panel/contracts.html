<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contracts</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/settings.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script>
      if (window.location.protocol === "file:") {
        window.location.href = "./login.html";
      }
    </script>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-brands fa-opencart"></i>
        </div>

        <nav class="menu">
          <a id="ordersMenu" href="order.html">Orders</a>
          <a id="productsMenu" href="dashboard.html">Products</a>
          <a id="categoriesMenu" href="categories.html">Categories</a>
          <a id="campaignsMenu" href="campaigns.html">Campaigns</a>
          <a id="settingsMenu" href="general-settings.html">Settings</a>
        </nav>

        <div class="profile">
          <div class="user">
            <div class="userFirst">
              <p class="userNameFirst" id="userNameFirst"></p>
            </div>
            <div class="userName"><p id="userName">Users</p></div>
          </div>
          <button id="logoutBtn">Logout</button>
        </div>
      </aside>

      <div class="content">
        <header>
          <a href="general-settings.html" class="nav-item">
            General Settings
          </a>

          <a href="contracts.html" class="nav-item active"> Contracts </a>

          <a href="SEO-and-Analytics.html" class="nav-item">
            SEO and Analytics
          </a>

          <a href="roles.html" class="nav-item"> Roles </a>
        </header>

        <main>
          <div id="toastSuccess" class="toast success"></div>
          <div id="toastError" class="toast error"></div>
          <div class="contractsContainer">
            <div class="termsOfUse">
              <h4>Terms Of Use</h4>
              <div class="toolbar">
                <button class="boldBtn"><b>B</b></button>
                <button class="italicBtn"><i>I</i></button>
                <button class="underlineBtn"><u>U</u></button>

                <div class="font-size">
                  <button class="decreaseSize">-</button>
                  <button type="button" class="fontSizeValue">16</button>
                  <button class="increaseSize">+</button>
                </div>
                <button class="unorderedList">
                  <i class="fa-solid fa-list-ul"></i>
                </button>

                <button class="orderedList">
                  <i class="fa-solid fa-list-ol"></i>
                </button>

                <input type="color" class="textColor" />
                <div class="align-menu">
                  <button class="alignToggle">
                    <i class="fa-solid fa-align-left"></i>
                  </button>

                  <div class="alignOptions">
                    <button data-align="left">
                      <i class="fa-solid fa-align-left"></i>
                    </button>

                    <button data-align="center">
                      <i class="fa-solid fa-align-center"></i>
                    </button>

                    <button data-align="right">
                      <i class="fa-solid fa-align-right"></i>
                    </button>

                    <button data-align="justify">
                      <i class="fa-solid fa-align-justify"></i>
                    </button>
                  </div>
                </div>
                <input type="color" class="backgroundColor" />
              </div>

              <div id="termsEditor" class="editor" contenteditable="true"></div>
              <button id="saveTermsBtn" class="saveContractBtn">
                <span class="loader" id="termsLoader"></span>
                Save
              </button>
            </div>

            <div class="confidentialityAgreement">
              <h4>Confidentiality Agreement</h4>
              <div class="toolbar">
                <button class="boldBtn"><b>B</b></button>
                <button class="italicBtn"><i>I</i></button>
                <button class="underlineBtn"><u>U</u></button>

                <div class="font-size">
                  <button class="decreaseSize">-</button>
                  <button type="button" class="fontSizeValue">16</button>
                  <button class="increaseSize">+</button>
                </div>

                <button class="unorderedList">
                  <i class="fa-solid fa-list-ul"></i>
                </button>

                <button class="orderedList">
                  <i class="fa-solid fa-list-ol"></i>
                </button>

                <input type="color" class="textColor" />
                <div class="align-menu">
                  <button class="alignToggle">
                    <i class="fa-solid fa-align-left"></i>
                  </button>

                  <div class="alignOptions">
                    <button data-align="left">
                      <i class="fa-solid fa-align-left"></i>
                    </button>

                    <button data-align="center">
                      <i class="fa-solid fa-align-center"></i>
                    </button>

                    <button data-align="right">
                      <i class="fa-solid fa-align-right"></i>
                    </button>

                    <button data-align="justify">
                      <i class="fa-solid fa-align-justify"></i>
                    </button>
                  </div>
                </div>
                <input type="color" class="backgroundColor" />
              </div>

              <div
                id="privacyEditor"
                class="editor"
                contenteditable="true"
              ></div>
              <button id="savePrivacyBtn" class="saveContractBtn">
                <span class="loader" id="privacyLoader"></span>
                Save
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="./js/contracts.js" type="module"></script>
  </body>
</html>
