<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce</title>
    <link rel="stylesheet" href="./css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="login-page">
        <div class="login-page-image">
          <img src="./image/login-img.jpg" alt="" />
        </div>
        <div class="forms">
          <div class="login-page-sign form">
            <div class="error-message"></div>
            <div class="sign-menu">
              <div class="sign-logo">
                <i class="fa-brands fa-opencart"></i>
                <span class="sign-in-span">Sign in</span>
              </div>
              <div class="login-inputs">
                <input
                  type="email"
                  placeholder="E-mail Address*"
                  id="emailInput"
                />

                <div class="password-div">
                  <input type="password" id="password" placeholder="Password" />
                  <i class="fa-regular fa-eye"></i>
                  <i class="fa-regular fa-eye-slash" style="display: none"></i>
                </div>
              </div>

              <div class="forget-password-area">
                <a href="">Forgot password?</a>
              </div>

              <button class="login-sign-button">Sign in</button>

              <div class="login-page-question">
                <a href="" id="showSignUp">Don't have a account? Sign Up!</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/login.js" type="module"></script>
  </body>
</html>
